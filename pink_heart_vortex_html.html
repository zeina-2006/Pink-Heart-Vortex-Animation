<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Diamond Heart & Vortex</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050005; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; filter: drop-shadow(0 0 25px rgba(255, 105, 180, 0.7)); }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const pinkShades = ['#ff69b4', '#ff1493', '#ffb6c1', '#db7093', '#ff8da1', '#fff0f5'];

        // كلاس لقطع الألماس (Diamond Particles) اللي بتطير
        class DiamondParticle {
            constructor(x, y, z) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.size = Math.random() * 4 + 2;
                this.color = pinkShades[Math.floor(Math.random() * pinkShades.length)];
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 1.5 + 0.5;
                this.vortexRadius = Math.random() * 80 + 20;
            }
            update(centerX, centerY) {
                // حركة الدوامة (Vortex rotation)
                this.angle += 0.04;
                this.x = centerX + Math.cos(this.angle) * this.vortexRadius;
                this.y -= this.speed * 1.2; // طلوع لفوق
                this.vortexRadius *= 0.99; // تضيق كل ما طلعت لفوق
                
                if (this.y < centerY - 150) {
                    this.y = centerY + 150;
                    this.vortexRadius = Math.random() * 80 + 20;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                
                // رسم شكل قطعة ألماس (Diamond shape)
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 1.5);
                ctx.lineTo(this.size, 0);
                ctx.lineTo(0, this.size * 1.5);
                ctx.lineTo(-this.size, 0);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
        }

        // إعداد نقاط القلب ثلاثي الأبعاد
        let heartPoints = [];
        for (let i = 0; i < 350; i++) {
            const t = Math.random() * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            const z = (Math.random() - 0.5) * 10;
            heartPoints.push({ x, y, z, color: pinkShades[Math.floor(Math.random() * pinkShades.length)] });
        }

        let diamonds = [];
        for (let i = 0; i < 70; i++) {
            diamonds.push(new DiamondParticle(canvas.width / 2, canvas.height / 2 + 100, 0));
        }

        let angleY = 0;

        function animate() {
            ctx.fillStyle = 'rgba(5, 0, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 30;
            const scale = Math.min(canvas.width, canvas.height) / 38;

            angleY += 0.02; // سرعة دوران القلب

            // رسم وتحديث القلب المتحرك 3D
            heartPoints.forEach(p => {
                // دوران حول محور Y
                const cos = Math.cos(angleY);
                const sin = Math.sin(angleY);
                const x3d = p.x * cos - p.z * sin;
                const z3d = p.z * cos + p.x * sin;

                const fov = 350;
                const alpha = fov / (fov + z3d + 150);
                const px = centerX + x3d * scale * alpha;
                const py = centerY + p.y * scale * alpha;

                ctx.save();
                ctx.globalAlpha = Math.max(0.2, alpha);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(px, py, 2.5 * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // تحديث ورسم الدوامة وقطع الدايموند في الأسفل
            diamonds.forEach(d => {
                d.update(centerX, centerY + 180);
                d.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
